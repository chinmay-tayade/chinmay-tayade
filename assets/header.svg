<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-label="Chinmay Tayade — Mobile Engineer. Android, Kotlin, Jetpack Compose, Kotlin Multiplatform.">
  <title>Chinmay Tayade — Mobile Engineer</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <style>
    /* Resting state is fully legible. Animation only enhances. */
    .name   { font: 700 33px ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; fill: #e6edf3; letter-spacing: 1.5px; }
    .role   { font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #c084fc; letter-spacing: 3.5px; }
    .stack  { font: 400 12.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #8b949e; }
    .stack2 { font: 400 11.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #6e7681; }
    .lbl    { font: 500 10px ui-monospace, "SF Mono", Menlo, monospace; fill: #6e7681; letter-spacing: 1px; }
    .amt    { font: 700 21px ui-monospace, "SF Mono", Menlo, monospace; fill: #e6edf3; }
    .pillt  { font: 700 10.5px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 1.5px; }

    .cursor { fill: #c084fc; animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* base state visible; animations replay from hidden but never leave content hidden */
    .rule { transform-origin: 46px 0; animation: rule 1s cubic-bezier(.2,.7,.2,1) .1s; }
    @keyframes rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .rise { animation: rise .7s ease; }
    .r1 { animation-delay: .30s; } .r2 { animation-delay: .44s; } .r3 { animation-delay: .58s; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    /* pills cycle PENDING -> SYNCING -> CONFIRMED; PENDING is the frozen-safe default */
    .s1 { opacity: 1; animation: c1 6.6s infinite; }
    .s2 { opacity: 0; animation: c2 6.6s infinite; }
    .s3 { opacity: 0; animation: c3 6.6s infinite; }
    @keyframes c1 { 0%,30%{opacity:1} 34%,100%{opacity:0} }
    @keyframes c2 { 0%,30%{opacity:0} 34%,63%{opacity:1} 67%,100%{opacity:0} }
    @keyframes c3 { 0%,63%{opacity:0} 67%,97%{opacity:1} 100%{opacity:0} }

    .dots circle { animation: pd 1.15s infinite; }
    .dots circle:nth-child(2) { animation-delay: .18s; }
    .dots circle:nth-child(3) { animation-delay: .36s; }
    @keyframes pd { 0%,100%{opacity:.25} 50%{opacity:1} }

    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-16px); } to { transform: translateY(210px); } }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .rule, .rise, .s1, .s2, .s3, .dots circle, .scan { animation: none; }
      .s1 { opacity: 0; } .s3 { opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="858" height="238" rx="18" fill="#0d1117" stroke="#21262d"/>

  <g opacity="0.5">
    <line x1="150" y1="18" x2="150" y2="222" stroke="#161b22"/>
    <line x1="310" y1="18" x2="310" y2="222" stroke="#161b22"/>
    <line x1="470" y1="18" x2="470" y2="222" stroke="#161b22"/>
  </g>
  <g clip-path="inset(2px round 18px)">
    <rect class="scan" x="1" y="0" width="858" height="12" fill="#a855f7" opacity="0.04"/>
  </g>

  <!-- left: identity -->
  <text class="name" x="46" y="92">CHINMAY TAYADE<tspan class="cursor" dx="4">&#9608;</tspan></text>
  <rect class="rule" x="46" y="106" width="176" height="3" rx="1.5" fill="url(#edge)"/>
  <text class="role rise r1" x="48" y="134">MOBILE&#160;&#160;ENGINEER</text>
  <text class="stack rise r2" x="48" y="158">Android&#160; · &#160;Kotlin&#160; · &#160;Jetpack Compose&#160; · &#160;Kotlin Multiplatform</text>
  <text class="stack2 rise r3" x="48" y="178">offline-first&#160; · &#160;secure by design&#160; · &#160;shared core, native UI</text>

  <!-- right: the transfer, cycling PENDING -> SYNCING -> CONFIRMED -->
  <g transform="translate(628,40)">
    <rect x="0" y="0" width="196" height="160" rx="16" fill="#010409" stroke="#30363d"/>
    <text class="lbl" x="20" y="32">OUTGOING&#160;TRANSFER</text>
    <text class="amt" x="20" y="60">&#163;240.00</text>

    <g class="s1">
      <rect x="20" y="80" width="98" height="26" rx="13" fill="#3a1d00" stroke="#d29922"/>
      <text class="pillt" x="34" y="97" fill="#d29922">PENDING</text>
    </g>
    <g class="s2">
      <rect x="20" y="80" width="132" height="26" rx="13" fill="#0a2a4a" stroke="#58a6ff"/>
      <text class="pillt" x="34" y="97" fill="#58a6ff">SYNCING</text>
      <g class="dots" transform="translate(112,93)">
        <circle cx="0" cy="0" r="2.4" fill="#58a6ff"/>
        <circle cx="8" cy="0" r="2.4" fill="#58a6ff"/>
        <circle cx="16" cy="0" r="2.4" fill="#58a6ff"/>
      </g>
    </g>
    <g class="s3">
      <rect x="20" y="80" width="132" height="26" rx="13" fill="#0d2a17" stroke="#3fb950"/>
      <text class="pillt" x="34" y="97" fill="#3fb950">CONFIRMED</text>
      <path class="check" d="M120 93 l4.5 4.5 l8 -10" stroke="#3fb950" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text class="lbl" x="20" y="130" fill="#6e7681">idempotency key</text>
    <text class="lbl" x="20" y="146" fill="#6e7681">optimistic UI · backoff + jitter</text>
  </g>

  <rect x="1" y="201" width="858" height="38" fill="url(#fade)" opacity="0.55"/>
</svg>
